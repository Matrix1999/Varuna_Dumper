name: Build Varuna Dumper APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM32 and ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew \
            assembleVarunaDumper32Debug \
            assembleVarunaDumper64Debug \
            --stacktrace

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: varuna-dumper-arm32-debug
          path: app/build/outputs/apk/VarunaDumper32/debug/*.apk
          if-no-files-found: error

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: varuna-dumper-arm64-debug
          path: app/build/outputs/apk/VarunaDumper64/debug/*.apk
          if-no-files-found: error