plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'top.niunaijun.varuna_dumper'
    compileSdk 36
    flavorDimensions "abi"

    defaultConfig {
        applicationId "top.niunaijun.varuna_dumper"
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName "3.2.0"


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    productFlavors {
        VarunaDumper32 {
            dimension "abi"
            applicationId "core.base.varuna_dumper32"
            ndk {
                abiFilters "armeabi-v7a"
            }
            resValue "string", "app_name", "Varuna Dumper 32"
        }

        VarunaDumper64 {
            dimension "abi"
            applicationId "core.base.varuna_dumper64"
            ndk {
                abiFilters "arm64-v8a"
            }
            resValue "string", "app_name", "Varuna Dumper 64"
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures{
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation project(':Bcore')

    //coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    //viewModel liveData  lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.9.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"

    //third

    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:files:3.2.1'
    //dialog
    implementation 'com.github.nukc:StateView:v2.2.0'
    //状态控制控件
    implementation 'com.github.Ferfalk:SimpleSearchView:0.2.0'
    //searchView

    implementation  'com.umeng.umsdk:common:9.3.8'
    implementation  'com.umeng.umsdk:asms:1.2.2'
    //友盟

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}